<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LADENT Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E6EBE9; --line:#D3DBD8; --ink:#15201D; --muted:#5A6965;
  --accent:#13615C; --accent-ink:#FFFFFF; --accent-soft:#D6EAE6;
  --late:#B8322B; --late-soft:#F7DFDC; --soon:#A86400; --soon-soft:#FAEACC;
  --ontime:#2B7A4B; --ontime-soft:#DAEFE1; --standby:#5F50A0; --standby-soft:#E6E2F5;
  --rev:#2D5C9E; --rev-soft:#DCE6F5;
  --wait:#5A6965; --wait-soft:#E3E9E7; --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 20px rgba(20,40,35,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#17211E; --sunk:#1E2A27; --line:#2C3A36; --ink:#E5EEEB; --muted:#9AABA6;
  --accent:#4FB3A9; --accent-ink:#0B1513; --accent-soft:#1D3733;
  --late:#F0796F; --late-soft:#3A1F1C; --soon:#E8A93F; --soon-soft:#36291A; --ontime:#6BC890; --ontime-soft:#1A3324;
  --standby:#A99BEA; --standby-soft:#272240; --rev:#8DB5EE; --rev-soft:#1B2840; --wait:#9AABA6; --wait-soft:#24302D; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17211E; --sunk:#1E2A27; --line:#2C3A36; --ink:#E5EEEB; --muted:#9AABA6;
  --accent:#4FB3A9; --accent-ink:#0B1513; --accent-soft:#1D3733;
  --late:#F0796F; --late-soft:#3A1F1C; --soon:#E8A93F; --soon-soft:#36291A; --ontime:#6BC890; --ontime-soft:#1A3324;
  --standby:#A99BEA; --standby-soft:#272240; --rev:#8DB5EE; --rev-soft:#1B2840; --wait:#9AABA6; --wait-soft:#24302D; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:560px){.seg{width:100%}.seg button{flex:1 1 0;padding:8px 6px;font-size:13px}.seg .who{display:none}}
.seg button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip-opt:focus-within,button.folio:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px}
h1{font-family:var(--f-display);font-size:26px;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:18px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid-r{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.grid-r{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.count{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:20px;padding:2px 8px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f .opt{font-weight:400}
.in{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0;color:var(--ink);font-weight:400}
textarea.in{resize:vertical;min-height:62px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.fs{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.fs legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.sm .chip-opt span{padding:5px 11px;font-size:14px}
.chip-opt{position:relative;display:inline-flex}
.chip-opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip-opt span{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;background:var(--surface);cursor:pointer}
.chip-opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.alumno-box{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px}
.cx-box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cx-box .chk{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.cx-box .chk input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--soon);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.revb{border-color:var(--rev);color:var(--rev)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:12px 18px;font-size:16px}
.err{color:var(--late);font-size:13px;font-weight:600}
.folio{font-family:var(--f-mono);font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
button.folio{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.plan{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tc{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tc.Elite{background:var(--ink);color:var(--surface)}
.tc.Gold{background:var(--soon-soft);color:var(--soon)}
.tc.Alumnos{background:var(--standby-soft);color:var(--standby)}
.tc.cx{background:transparent;border:1px solid var(--late);color:var(--late)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-late{background:var(--late-soft);color:var(--late)} .s-soon{background:var(--soon-soft);color:var(--soon)}
.s-ontime{background:var(--ontime-soft);color:var(--ontime)} .s-standby{background:var(--standby-soft);color:var(--standby)}
.s-wait{background:var(--wait-soft);color:var(--wait)} .s-ok{background:var(--ontime);color:var(--surface)}
.s-rev{background:var(--rev-soft);color:var(--rev)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.late{border-left:4px solid var(--late)} .card.soon{border-left:4px solid var(--soon)} .card.ontime{border-left:4px solid var(--ontime)}
.card.standby{border-left:4px solid var(--standby)} .card.wait{border-left:4px solid var(--line)} .card.ok{border-left:4px solid var(--ontime)}
.card.rev{border-left:4px solid var(--rev)}
.card.flash{animation:fl 1.4s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none;box-shadow:0 0 0 3px var(--accent)}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.meta{color:var(--muted);font-size:13px}
.k{font-size:12px;color:var(--muted)}
.tt{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dots{display:flex;align-items:flex-start;gap:0;flex-wrap:nowrap}
.dot-i{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1 1 0;position:relative}
.dot-i:not(:last-child)::after{content:"";position:absolute;top:6px;left:calc(50% + 8px);right:calc(-50% + 8px);height:2px;background:var(--line)}
.dot-i.done:not(:last-child)::after{background:var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.dot-i.done .dot{background:var(--accent);border-color:var(--accent)}
.dot-i.cur .dot{border-width:4px}
.dot-i.cur.late .dot{border-color:var(--late)} .dot-i.cur.soon .dot{border-color:var(--soon)} .dot-i.cur.ontime .dot{border-color:var(--ontime)}
.dot-i.cur.wait .dot{border-color:var(--muted)} .dot-i.cur.standby .dot{border-color:var(--standby)} .dot-i.cur.rev .dot{border-color:var(--rev)}
.dot-l{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2;overflow-wrap:anywhere}
.dot-i.cur .dot-l{color:var(--ink);font-weight:600}
.prs{display:flex;flex-wrap:wrap;gap:6px}
.pr{font-size:12px;border-radius:6px;padding:2px 8px;border:1px dashed var(--line);color:var(--muted);white-space:nowrap}
.pr.hecha{border-style:solid;border-color:var(--ontime);color:var(--ontime);background:var(--ontime-soft)}
.pr.fuera{border-style:solid;border-color:var(--standby);color:var(--standby);background:var(--standby-soft);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:1060px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.sum.late b{color:var(--late)} .sum.standby b{color:var(--standby)} .sum.pend b{color:var(--accent)} .sum.rep b{color:var(--soon)} .sum.rev b{color:var(--rev)}
.rep-box{border-radius:8px;background:var(--soon-soft);padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.rev-box{border-radius:8px;background:var(--rev-soft);padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.rep-tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soon)}
.rev-tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--rev)}
.card.report{border-left:4px solid var(--soon)}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.board-scroll{overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;padding-inline:4px;min-width:min-content}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:13px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.05em;gap:6px}
.empty{color:var(--muted);font-size:13px;padding:6px 2px;margin:0}
.scan{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.scan .in{flex:1 1 180px;font-family:var(--f-mono);font-size:17px}
.scan .btn{min-height:44px}
@media (max-width:520px){.scan .btn{flex:1 1 0}}
.tjobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-top:14px}
.tjob{padding:14px}
.tjob .folio{font-size:24px}
.tjob .etapa{font-family:var(--f-display);font-size:20px}
.tact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tact .main{grid-column:1/-1;min-height:52px;font-size:17px}
.tact .btn{min-height:44px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.spec dt{color:var(--muted);font-size:13px}
.spec dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.42);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(540px,100%);height:100%;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(460px,100%);max-height:100%;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.qrbox{background:#FFFFFF;border-radius:8px;padding:8px;display:inline-block;line-height:0}
.label-prev{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist li>span{min-width:0;overflow-wrap:anywhere}
.hist time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist b{font-weight:600}
.x{border:0;background:var(--sunk);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.msg{font-size:14px;border-radius:8px;padding:8px 10px;background:var(--sunk)}
.msg.bad{background:var(--late-soft);color:var(--late)} .msg.good{background:var(--ontime-soft);color:var(--ontime)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (max-width:520px){h1{font-size:23px}.panel{padding:14px}.hist li{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><b>LADENT</b><span>Control de trabajos</span></div>
  <div class="seg" role="group" aria-label="Rol">
    <button data-act="role" data-v="recepcion">Recepción<span class="who"> · Karen</span></button>
    <button data-act="role" data-v="rebeca">Asignación<span class="who"> · Rebeca</span></button>
    <button data-act="role" data-v="tecnico">Técnicos</button>
  </div>
</div></header>
<main class="wrap" id="view"></main>
<div id="layer"></div>

<script>
const ETAPAS=['Dados (Yeso)','Diseño','Metales','E.max','Porcelana','Terminado'];
const DIAS={'Dados (Yeso)':1,'Diseño':1,'Metales':3,'E.max':3,'Porcelana':3,'Terminado':1};
const TECNICOS=['Silvana','Mauro','Omar','Ana','Luis','Gema','Mónica','Oscar'];
const TIPOS_CLIENTE=['General','Gold','Elite','Alumnos'];
const PRIO={Elite:0,Gold:1,General:2,Alumnos:2};
const PRUEBAS=['Metal','P. Resina','Porcelana'];
const MAT_TRABAJO=['MP','Emax EST','Emax MON','Cerómero','ZR EST','ZR MON','Metálica','PMMA EST','PMMA MON','Collarless','Resina híbrida','Encerado'];
const MAT_ENVIADO=['Articulador','Registro de mordida','Impresión','Antagonista','Modelo de trabajo','Encerado','Pin de impresión','Análogo','Pilar protésico','Escaneo intraoral','Digital'];
const KEY='ladent-datos';
const H=3600e3;
const pad=(n,w)=>String(n).padStart(w,'0');
const firstLine=s=>String(s||'').split('\n')[0];
const resumen=t=>`${firstLine(t.tipoTrabajo)} · ${t.materialTrabajo.join(', ')} · ${t.procesos.map(p=>p.etapa).join(' → ')}`;

function seed(){
  const now=Date.now(); const at=h=>new Date(now+h*H).toISOString(); const list=[];
  function job(o){
    const t={folio:o.folio,tipoCliente:o.tc,plan:o.plan?{tipo:o.tc,n:o.plan}:null,doctor:o.dr,paciente:o.pac,tipoTrabajo:o.tt,dientes:o.d||'',color:o.col||'A2',
      materialTrabajo:o.mt,materialEnviado:o.me||['Modelo de trabajo','Antagonista'],especificaciones:o.esp||'',
      pruebas:(o.pr||[]).map(x=>({tipo:x,estado:'pendiente',salida:null,regreso:null})),
      complejo:o.cx!=null?o.cx:o.mt.length>1,complejoNota:o.cxn||'',revision:null,
      fechaPrometida:o.prom!=null?at(o.prom):'',notas:o.n||'',alumno:o.al||null,
      procesos:o.ruta.map(e=>({etapa:e,tecnico:null,inicio:null,limite:null,inicioReal:null,finReal:null})),actual:0,estado:'pendiente',creado:at(-o.age),historial:[],incidencias:[]};
    let tc=-o.age; const L=(h,tipo,det,por)=>t.historial.push({ts:at(h),tipo,detalle:det,por});
    L(tc,'Alta',resumen(t),'Karen');
    if(t.complejo)L(tc,'Complejo',t.complejoNota||'Marcado al dar de alta','Karen');
    const done=o.done||[]; const step=(o.age-2)/(done.length+1);
    done.forEach((tec,i)=>{const p=t.procesos[i];const a=tc+.5,s=a+.5,e=tc+step;p.tecnico=tec;p.inicio=at(a);p.limite=at(a+DIAS[p.etapa]*24);p.inicioReal=at(s);p.finReal=at(e);
      L(a,'Asignación',`${p.etapa} → ${tec}`,'Rebeca');L(s,'Inicio',p.etapa,tec);L(e,'Fin',p.etapa,tec);tc=e;t.actual=i+1;});
    (o.ph||[]).forEach(([s,r],k)=>{const p=t.pruebas[k];p.estado='hecha';p.salida=at(s);p.regreso=at(r);
      L(s,'Sale a prueba',`Prueba ${k+1} de ${t.pruebas.length}: ${p.tipo}`,'Rebeca');L(r,'Regresó de prueba',`${p.tipo} ✓`,'Karen');});
    if(t.actual>=t.procesos.length){t.actual=t.procesos.length-1;t.estado='listo';L(tc+.2,'Listo para entrega','Todos los procesos terminados','Sistema');}
    if(o.cur){const p=t.procesos[t.actual];p.tecnico=o.cur.t;p.inicio=at(tc+.5);p.limite=at(o.cur.lim);L(tc+.5,'Asignación',`${p.etapa} → ${p.tecnico}`,'Rebeca');t.estado='asignado';
      if(o.cur.started){p.inicioReal=at(tc+1);L(tc+1,'Inicio',p.etapa,p.tecnico);t.estado='en_proceso';}}

function cardFuera(t){
  const head=`<div class="row sb"><span class="row">${flink(t)}</span>${pill(t)}</div><div class="row">${tcb(t)}</div>`;
  if(t.revision)return `<div class="card rev">${head}<div class="meta">${esc(t.doctor)} · ${esc(t.paciente)}</div>
    <div class="rev-box"><span class="rev-tag">En revisión desde ${fmt(t.revision.desde)}</span><span>${esc(t.revision.nota)||'Sin nota'}</span></div>
    <div class="row"><button class="btn pri sm" data-act="autorizar" data-f="${esc(t.folio)}">Autorizado</button></div></div>`;
  if(t.estado==='pausa'){const last=[...t.historial].reverse().find(h=>h.tipo==='Stand by');return `<div class="card standby">${head}
    <div class="meta">${esc(t.doctor)} · ${esc(cur(t).etapa)} con ${esc(cur(t).tecnico||'—')}</div>${dots(t)}
    <div class="k">Pausado ${last?fmt(last.ts)+' · '+esc(last.detalle):''}</div>
    <div class="row"><button class="btn pri sm" data-act="reanudar" data-f="${esc(t.folio)}">Reanudar</button></div></div>`;}
  const fp=t.pruebas.find(p=>p.estado==='fuera');
  return `<div class="card standby">${head}<div class="meta">${esc(t.doctor)} · ${esc(t.paciente)}</div>${prs(t)}
    <div class="k">Salió ${fp?fmt(fp.salida):''}. Recepción lo reactiva cuando regrese.</div></div>`;
}
function showAssign(t){
  const p=cur(t); const edit=!!p.tecnico;
  const ini=p.inicio?new Date(p.inicio):new Date(Math.ceil(Date.now()/H)*H);
  const lim=p.limite?new Date(p.limite):new Date(ini.getTime()+DIAS[p.etapa]*24*H);
  document.getElementById('layer').innerHTML=`<div class="overlay center" data-act="close-bg"><form class="modal" id="asig" role="dialog" aria-modal="true" aria-labelledby="as-h">
   <div class="row sb"><h2 id="as-h">${edit?'Cambiar asignación':'Asignar'} · <span class="folio">${esc(t.folio)}</span></h2><button class="x" type="button" data-act="close" aria-label="Cerrar">×</button></div>
   <div class="meta">${esc(firstLine(t.tipoTrabajo))} · ${esc(t.materialTrabajo.join(', '))} · etapa <b style="color:var(--ink)">${esc(p.etapa)}</b></div>
   <label class="f">Técnico<select class="in" id="as-t">${edit?'':'<option value="">Elige un técnico</option>'}${TECNICOS.map(x=>`<option ${x===p.tecnico?'selected':''}>${x}</option>`).join('')}</select></label>
   <div class="fgrid"><label class="f">Inicio estimado<input class="in" type="datetime-local" id="as-i" value="${toLocal(ini)}"></label>
   <label class="f">Límite de la etapa<input class="in" type="datetime-local" id="as-l" value="${toLocal(lim)}"></label></div>
   <span class="k">Tiempo estándar de ${esc(p.etapa)}: ${DIAS[p.etapa]} día${DIAS[p.etapa]>1?'s':''}. Ajústalo según la carga.</span>
   <label class="f">Nota <span class="opt">(opcional, queda en el historial)</span><input class="in" id="as-n" placeholder="Ej. se necesita más tiempo"></label>
   <div id="as-err" class="err" role="alert"></div>
   <div class="row"><button class="btn pri" type="submit">${edit?'Guardar cambios':'Asignar'}</button><button class="btn" type="button" data-act="close">Cancelar</button></div>
  </form></div>`;
  document.getElementById('asig').addEventListener('submit',ev=>{ev.preventDefault();
    const tec=document.getElementById('as-t').value,i=document.getElementById('as-i').value,l=document.getElementById('as-l').value,n=document.getElementById('as-n').value.trim();
    if(!tec||!i||!l){document.getElementById('as-err').textContent='Elige técnico, inicio y límite.';return;}
    if(new Date(l)<=new Date(i)){document.getElementById('as-err').textContent='El límite debe ser después del inicio.';return;}
    const before=p.tecnico; p.tecnico=tec;p.inicio=new Date(i).toISOString();p.limite=new Date(l).toISOString();
    if(!edit){t.estado='asignado';log(t,'Asignación',`${p.etapa} → ${tec} · límite ${fmt(p.limite)}${n?' · '+n:''}`,'Rebeca');}
    else log(t,before!==tec?'Reasignación':'Cambio de fechas',`${p.etapa} → ${tec} · límite ${fmt(p.limite)}${n?' · '+n:''}`,'Rebeca');
    save();closeLayer();render();});
}

function onScan(e){
  e.preventDefault(); const raw=document.getElementById('scan-in').value.replace(/^LADENT:/i,'').trim(); if(!raw)return;

  if(!t)ui.scanMsg={k:'bad',t:`No existe el folio ${raw}.`};
  else if(!['asignado','en_proceso','pausa'].includes(t.estado)||cur(t).tecnico!==ui.tecnico)ui.scanMsg={k:'bad',t:`El folio ${t.folio} no está asignado a ${ui.tecnico}. Estado: ${status(t).l}${cur(t).tecnico?' · lo tiene '+cur(t).tecnico:''}.`};

     <dt>Trabajo</dt><dd>${esc(t.tipoTrabajo)}</dd><dt>Dientes</dt><dd>${esc(t.dientes)||'—'}</dd><dt>Color</dt><dd>${esc(t.color)||'—'}</dd>
     <dt>Material</dt><dd>${esc(t.materialTrabajo.join(', '))}</dd><dt>Enviado</dt><dd>${esc(t.materialEnviado.join(', '))||'—'}</dd>
     <dt>Promesa</dt><dd>${fmtD(t.fechaPrometida)}</dd>${t.especificaciones?`<dt>Especif.</dt><dd>${esc(t.especificaciones)}</dd>`:''}${t.notas?`<dt>Notas</dt><dd>${esc(t.notas)}</dd>`:''}
     ${t.alumno?`<dt>Semestre</dt><dd>${esc(t.alumno.semestre)}</dd><dt>Horario</dt><dd>${esc(t.alumno.horario)}</dd><dt>Docentes</dt><dd>${esc(t.alumno.docentes)}</dd>`:''}</dl>
    <div class="qrbox" id="qr-dr"></div></div>
   ${acts}
   ${t.incidencias.length?`<div class="panel stack" style="gap:8px"><h2>Reportes</h2>${[...t.incidencias].reverse().map(r=>`<div class="rep-box"><span class="rep-tag">${esc(REP_EST[r.estado])}</span><span>${esc(r.nota)}</span><span class="k">${esc(r.por)} · ${esc(r.etapa)} · ${fmt(r.ts)}</span></div>`).join('')}</div>`:''}
   <div class="panel"><h2 style="margin-bottom:6px">Procesos</h2><ul class="hist">${t.procesos.map(p=>`<li><span class="k">${esc(p.etapa)}</span><span>${p.tecnico?`<b>${esc(p.tecnico)}</b> · `:''}${p.finReal?`terminó ${fmt(p.finReal)}`:p.inicioReal?`trabajando desde ${fmt(p.inicioReal)}`:p.tecnico?`límite ${fmt(p.limite)}`:'<span class="meta">sin asignar</span>'}</span></li>`).join('')}</ul></div>
   <div class="panel"><h2 style="margin-bottom:6px">Historial</h2><p class="k" style="margin:0 0 6px">El folio es el mismo durante todo el trabajo. Cada salida, regreso y cambio queda registrado.</p>
    <ul class="hist">${[...t.historial].reverse().map(h=>`<li><time>${fmt(h.ts)}</time><span><b>${esc(h.tipo)}</b> · ${esc(h.detalle)} <span class="meta">— ${esc(h.por)}</span></span></li>`).join('')}</ul></div>
  </aside></div>`;
  qr(document.getElementById('qr-dr'),t.folio,96);
}
function qr(el,folio,size){el.innerHTML='';try{if(window.QRCode)new QRCode(el,{text:'LADENT:'+folio,width:size,height:size,colorDark:'#000000',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M});else el.textContent='QR';}catch(e){el.textContent='QR'}}
function closeLayer(){document.getElementById('layer').innerHTML=''}

/* ---------- Render y eventos ---------- */
function render(){
  document.querySelectorAll('[data-act="role"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ui.role));
  const v=document.getElementById('view');
  v.innerHTML=ui.role==='recepcion'?vRecepcion():ui.role==='rebeca'?vRebeca():vTecnico();
  if(ui.role==='recepcion'){bindAlta();bindAside();}
  if(ui.role==='rebeca')document.getElementById('filtro').addEventListener('change',e=>{ui.filtroTec=e.target.value;render();});
  if(ui.role==='tecnico'){document.getElementById('me').addEventListener('change',e=>{ui.tecnico=e.target.value;ui.scanMsg=null;render();});document.getElementById('scan').addEventListener('submit',onScan);}
}
function bindAside(){const f=document.getElementById('buscar');if(f)f.addEventListener('submit',e=>{e.preventDefault();const t=findT(document.getElementById('b-f').value);
  if(t){ui.recMsg=null;showDrawer(t);}else{ui.recMsg='No se encontró ese folio. Revisa que esté bien escrito.';refreshAside();}});}
function refreshAside(){const a=document.getElementById('rec-aside');if(a){a.innerHTML=vRecAside();bindAside();}else render();}
function after(t){save();if(ui.role==='recepcion')refreshAside();else render();if(document.querySelector('.drawer'))showDrawer(t);}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return; const act=b.dataset.act; const t=b.dataset.f?findT(b.dataset.f):null;
  if(act==='close-bg'){if(e.target===b)closeLayer();return;}
  if(act==='close'){closeLayer();return;}
  if(act==='role'){ui.role=b.dataset.v;ui.scanMsg=null;closeLayer();render();return;}
  if(act==='reset'){S=seed();save();closeLayer();render();return;}
  if(act==='camara'){ui.scanMsg={k:'',t:'La cámara se activará en la versión para celular. Por ahora escribe el folio.'};render();document.getElementById('scan-in').focus();return;}
  if(act==='open'&&t){showDrawer(t);return;}
  if(act==='assign'&&t){showAssign(t);return;}
  if(act==='reportar'&&t){showReport(t);return;}
  if(act==='prueba'&&t){showPrueba(t);return;}
  if(act==='revision'&&t){showRevision(t);return;}
  if(act==='autorizar'&&t){t.revision=null;log(t,'Autorizado','Se quita la revisión','Rebeca');after(t);return;}
  if(act==='cx-on'&&t){const n=(document.getElementById('dr-cxn')||{}).value||'';t.complejo=true;t.complejoNota=n.trim();log(t,'Complejo',t.complejoNota||'Marcado en proceso',ui.role==='rebeca'?'Rebeca':'Karen');after(t);return;}
  if(act==='cx-off'&&t){t.complejo=false;t.complejoNota='';log(t,'Ya no es complejo','Se quitó la marca',ui.role==='rebeca'?'Rebeca':'Karen');after(t);return;}
  if((act==='resuelto'||act==='standby')&&t){const r=t.incidencias.find(x=>x.id===b.dataset.r);if(!r)return;
    if(act==='resuelto'){r.estado='cerrado';log(t,'Reporte resuelto',r.nota,'Rebeca');}
    else{r.estado='standby';t.pausaPrev=t.estado;t.estado='pausa';log(t,'Stand by',`Por reporte: ${r.nota}`,'Rebeca');}
    save();render();return;}
  if(act==='reanudar'&&t){t.estado=t.pausaPrev||'asignado';delete t.pausaPrev;
    openReps(t).filter(r=>r.estado==='standby').forEach(r=>{r.estado='cerrado'});
    log(t,'Reanudado',`${cur(t).etapa} con ${cur(t).tecnico}`,'Rebeca');save();render();return;}
  if(act==='regreso'&&t){const sel=document.getElementById('reac-'+t.folio);const i=sel?+sel.value:t.actual;
    const fp=t.pruebas.find(p=>p.estado==='fuera');if(fp){fp.estado='hecha';fp.regreso=new Date().toISOString();}
    const nom=fp?fp.tipo:'Prueba';
    if(i<0){t.estado='listo';log(t,'Regresó de prueba',`${nom} ✓ · sigue listo para entrega`,'Karen');}
    else{for(let k=i;k<t.procesos.length;k++)Object.assign(t.procesos[k],{tecnico:null,inicio:null,limite:null,inicioReal:null,finReal:null});
      t.actual=i;t.estado='pendiente';log(t,'Regresó de prueba',`${nom} ✓ · reactivado en ${t.procesos[i].etapa}`,'Karen');}
    delete t.pruebaPrev;save();refreshAside();return;}
  if(act==='entregar'&&t){if(t.revision)return;t.estado='entregado';log(t,'Entregado','Entregado al doctor','Karen');save();refreshAside();return;}
  if(act==='iniciar'&&t){const p=cur(t);p.inicioReal=new Date().toISOString();t.estado='en_proceso';log(t,'Inicio',p.etapa,ui.tecnico);save();render();return;}
  if(act==='terminar'&&t){const p=cur(t);p.finReal=new Date().toISOString();log(t,'Fin',p.etapa,ui.tecnico);
    if(t.actual<t.procesos.length-1){t.actual++;t.estado='pendiente';ui.scanMsg={k:'good',t:`${t.folio} regresó con Rebeca para asignar ${cur(t).etapa}.`};}
    else{t.estado='listo';log(t,'Listo para entrega','Todos los procesos terminados','Sistema');ui.scanMsg={k:'good',t:`${t.folio} quedó listo para entrega.`};}
    save();render();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer();});
render();
</script>
</body>
</html>
